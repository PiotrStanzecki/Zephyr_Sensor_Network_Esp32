CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_ZVFS_POLL_MAX=64
CONFIG_POSIX_API=y
CONFIG_ZVFS_OPEN_MAX=64


CONFIG_NET_MAX_CONN=32
CONFIG_NET_MAX_CONTEXTS=32

# Wi-Fi 
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_WIFI_USAGE_MODE_AP=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y

# DHCP
CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_SERVER=y


CONFIG_LED_STRIP=y
CONFIG_I2S=y

# Sensor Drivers
CONFIG_SENSOR=y
CONFIG_SENSOR_ASYNC_API=y
CONFIG_ADC=y
CONFIG_ADC_ESP32=y
CONFIG_W1=y
CONFIG_DHT=y
CONFIG_GPIO=y
CONFIG_GPIO_ESP32=y
CONFIG_ADC_LOG_LEVEL_ERR=y

CONFIG_LOG=y
CONFIG_NET_LOG=y
CONFIG_ISR_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_IDLE_STACK_SIZE=1024
CONFIG_HEAP_MEM_POOL_SIZE=131072


CONFIG_NET_BUF_TX_COUNT=128
CONFIG_NET_BUF_RX_COUNT=128
CONFIG_NET_PKT_TX_COUNT=128
CONFIG_NET_PKT_RX_COUNT=128


CONFIG_NET_TCP_MAX_SEND_WINDOW_SIZE=8192
CONFIG_NET_TCP_MAX_RECV_WINDOW_SIZE=8192


CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=2048